name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check dependency graph availability
        id: dependency_graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response="$RUNNER_TEMP/dependency-graph-response.json"
          status="$(curl --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/dependency-graph/sbom")"

          case "$status" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            403|404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::warning::GitHub Dependency Graph is not enabled or not accessible. Enable Settings > Security > Advanced Security > Dependency graph before making this check mandatory."
              ;;
            *)
              echo "Unexpected GitHub Dependency Graph API status: $status" >&2
              exit 1
              ;;
          esac

      - name: Review dependency changes
        if: ${{ steps.dependency_graph.outputs.enabled == 'true' }}
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Explain unavailable dependency review
        if: ${{ steps.dependency_graph.outputs.enabled != 'true' }}
        run: |
          echo "Dependency Review is installed but cannot enforce vulnerability changes until GitHub Dependency Graph is enabled."
