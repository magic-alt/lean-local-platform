name: Temporary Maintenance Spacing

on:
  push:
    branches:
      - ci/close-certification-validation-gaps

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/close-certification-validation-gaps
      - name: Restore module-level spacing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("examples/a_share_financial_rotation_tushare/a_share_financial_rotation_study.py")
          text = path.read_text(encoding="utf-8")
          old = "    return out\n\ndef safe_rate"
          new = "    return out\n\n\ndef safe_rate"
          if text.count(old) != 1:
              raise SystemExit("expected compound_resample/safe_rate boundary not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check
          python -m compileall -q examples/a_share_financial_rotation_tushare
      - name: Commit formatting fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/a_share_financial_rotation_tushare/a_share_financial_rotation_study.py
          git commit -m "style: restore module-level spacing"
          git push origin HEAD:ci/close-certification-validation-gaps
