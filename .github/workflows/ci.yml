name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Governance checks always run. Compute-heavy hosted lanes remain opt-in while
# GitHub Actions quota is constrained; local validation is authoritative for a
# lane that is intentionally disabled. Set RUN_GITHUB_ACTIONS=1 to enable the
# standard hosted lanes without changing this workflow.
jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate repository hygiene
        run: python scripts/check_repository_hygiene.py
      - name: Validate open-source governance
        run: python scripts/check_oss_governance.py

  backend:
    name: Backend
    needs: governance
    if: ${{ vars.RUN_GITHUB_ACTIONS == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/backend/requirements-ml.lock
      - run: pip install --require-hashes -r web/backend/requirements-ml.lock
      - run: python -m pytest -q
        working-directory: web/backend

  frontend:
    name: Frontend
    needs: governance
    if: ${{ vars.RUN_GITHUB_ACTIONS == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  native-contract:
    name: Native contract
    needs: governance
    if: ${{ vars.RUN_GITHUB_ACTIONS == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/backend/requirements.lock
      - run: pip install --require-hashes -r web/backend/requirements.lock
      - run: python scripts/platformctl.py --help
      - run: python -m pytest -q tests/test_native_execution.py tests/test_platformctl.py tests/test_restricted_runner.py
        working-directory: web/backend

  windows-native-contract:
    name: Windows native contract
    needs: governance
    if: ${{ vars.RUN_GITHUB_ACTIONS == '1' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/backend/requirements.lock
      - run: pip install --require-hashes -r web/backend/requirements.lock
      - run: python scripts/platformctl.py --help
      - name: Validate Windows deployment PowerShell
        shell: pwsh
        run: |
          $errors = @()
          foreach ($path in @(
            "deploy/windows/configure_windows_sandbox.ps1",
            "deploy/windows/build_native_lean_runtime.ps1",
            "deploy/windows/run_local_native_runtime_release.ps1",
            "deploy/windows/run_local_native_validation.ps1",
            "deploy/windows/run_dockerless_golden_acceptance.ps1"
          )) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$null, [ref]$errors
            ) | Out-Null
          }
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Validate Windows native contracts
        run: >-
          python -m pytest -q
          tests/test_native_execution.py
          tests/test_platformctl.py
          tests/test_restricted_runner.py
          tests/test_windows_native_contract.py
          tests/test_windows_certification.py
        working-directory: web/backend

  docker-backtest:
    name: LEAN Docker integration
    needs: governance
    if: ${{ vars.RUN_GITHUB_ACTIONS == '1' && vars.RUN_LEAN_DOCKER_INTEGRATION == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r web/backend/requirements.lock
      - run: RUN_LEAN_DOCKER_INTEGRATION=1 python -m pytest -q tests/test_ashare_lean_integration.py
        working-directory: web/backend

  native-backtest:
    name: LEAN native integration
    needs: governance
    if: ${{ vars.RUN_GITHUB_ACTIONS == '1' && vars.RUN_LEAN_NATIVE_INTEGRATION == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r web/backend/requirements.lock
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: python scripts/install_lean_runtime.py install
      - run: RUN_LEAN_NATIVE_INTEGRATION=1 python -m pytest -q tests/test_ashare_native_integration.py
        working-directory: web/backend

  backend-parity:
    name: Backend parity
    needs: governance
    if: ${{ vars.RUN_GITHUB_ACTIONS == '1' && vars.RUN_LEAN_BACKEND_PARITY == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r web/backend/requirements.lock
      - run: RUN_LEAN_BACKEND_PARITY=1 python -m pytest -q tests/test_ashare_backend_parity.py
        working-directory: web/backend
