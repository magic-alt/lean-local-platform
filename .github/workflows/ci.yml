name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The merge gate is intentionally split between deterministic always-on lanes
# and expensive LEAN engine integrations. Required CI aggregates every
# deterministic lane; actual LEAN Docker/native parity remains opt-in and is
# exercised by full/local certification where the runtime is available.
jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository hygiene
        run: python scripts/check_repository_hygiene.py
      - name: Validate developer automation
        run: python scripts/check_developer_governance.py
      - name: Validate frontend API contract
        run: python scripts/check_frontend_api_contract.py
      - name: Validate open-source governance
        run: python scripts/check_oss_governance.py

  backend:
    name: Backend
    needs: governance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/backend/requirements-ml.lock
      - run: pip install --require-hashes -r web/backend/requirements-ml.lock
      - run: python -m pytest -q
        working-directory: web/backend

  frontend:
    name: Frontend
    needs: governance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  web-e2e-smoke:
    name: Web E2E smoke
    needs: governance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: pip install --require-hashes -r web/backend/requirements.lock
      - run: npm ci
        working-directory: web/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: web/frontend
      - name: Run responsive UI audit
        env:
          E2E_UI_ONLY: "1"
        run: >-
          npx playwright test 15-ui-audit.spec.ts
          --project=chromium-1280 --project=tablet --project=mobile
        working-directory: web/frontend
      - name: Run PostgreSQL/RabbitMQ smoke journey
        env:
          E2E_PYTHON: python
          E2E_REQUIRE_LEAN_RUNTIME: "0"
          E2E_STOP_STACK: "1"
        run: npx playwright test --project=chromium --grep @smoke
        working-directory: web/frontend
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-smoke-${{ github.run_id }}
          path: tests/e2e/reports
          if-no-files-found: warn

  native-contract:
    name: Native contract
    needs: governance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/backend/requirements.lock
      - run: pip install --require-hashes -r web/backend/requirements.lock
      - run: python scripts/platformctl.py --help
      - run: python -m pytest -q tests/test_native_execution.py tests/test_platformctl.py tests/test_restricted_runner.py
        working-directory: web/backend

  windows-native-contract:
    name: Windows native contract
    needs: governance
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/backend/requirements.lock
      - run: pip install --require-hashes -r web/backend/requirements.lock
      - run: python scripts/platformctl.py --help
      - name: Validate Windows deployment PowerShell
        shell: pwsh
        run: |
          $errors = @()
          foreach ($path in @(
            "deploy/windows/configure_windows_sandbox.ps1",
            "deploy/windows/build_native_lean_runtime.ps1",
            "deploy/windows/run_local_native_runtime_release.ps1",
            "deploy/windows/run_local_native_validation.ps1",
            "deploy/windows/run_dockerless_golden_acceptance.ps1"
          )) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$null, [ref]$errors
            ) | Out-Null
          }
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Validate Windows native contracts
        run: >-
          python -m pytest -q
          tests/test_native_execution.py
          tests/test_platformctl.py
          tests/test_restricted_runner.py
          tests/test_windows_native_contract.py
          tests/test_windows_certification.py
        working-directory: web/backend

  docker-backtest:
    name: LEAN Docker integration
    needs: governance
    if: ${{ vars.RUN_LEAN_DOCKER_INTEGRATION == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r web/backend/requirements.lock
      - run: RUN_LEAN_DOCKER_INTEGRATION=1 python -m pytest -q tests/test_ashare_lean_integration.py
        working-directory: web/backend

  native-backtest:
    name: LEAN native integration
    needs: governance
    if: ${{ vars.RUN_LEAN_NATIVE_INTEGRATION == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r web/backend/requirements.lock
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: python scripts/install_lean_runtime.py install
      - run: RUN_LEAN_NATIVE_INTEGRATION=1 python -m pytest -q tests/test_ashare_native_integration.py
        working-directory: web/backend

  backend-parity:
    name: Backend parity
    needs: governance
    if: ${{ vars.RUN_LEAN_BACKEND_PARITY == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r web/backend/requirements.lock
      - run: RUN_LEAN_BACKEND_PARITY=1 python -m pytest -q tests/test_ashare_backend_parity.py
        working-directory: web/backend

  required-ci:
    name: Required CI
    if: always()
    needs:
      - governance
      - backend
      - frontend
      - web-e2e-smoke
      - native-contract
      - windows-native-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every deterministic lane
        env:
          GOVERNANCE: ${{ needs.governance.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          WEB_E2E_SMOKE: ${{ needs.web-e2e-smoke.result }}
          NATIVE_CONTRACT: ${{ needs.native-contract.result }}
          WINDOWS_NATIVE_CONTRACT: ${{ needs.windows-native-contract.result }}
        run: |
          python - <<'PY'
          import os
          checks = {
              "Governance": os.environ["GOVERNANCE"],
              "Backend": os.environ["BACKEND"],
              "Frontend": os.environ["FRONTEND"],
              "Web E2E smoke": os.environ["WEB_E2E_SMOKE"],
              "Native contract": os.environ["NATIVE_CONTRACT"],
              "Windows native contract": os.environ["WINDOWS_NATIVE_CONTRACT"],
          }
          failed = {name: result for name, result in checks.items() if result != "success"}
          if failed:
              raise SystemExit(f"Required CI failed: {failed}")
          print("Required CI passed:", checks)
          PY
