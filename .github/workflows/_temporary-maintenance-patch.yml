name: Temporary Maintenance Patch

on:
  push:
    branches:
      - ci/close-certification-validation-gaps

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/close-certification-validation-gaps
      - name: Apply deterministic source and lock migrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one replacement in {path}, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          old_function = '''def compound_resample(panel: pd.DataFrame, frequency: str) -> pd.DataFrame:
              if frequency == "daily":
                  return panel.copy()
              rule = {"weekly": "W-FRI", "monthly": "ME"}[frequency]
              try:
                  grouped = panel.resample(rule)
              except ValueError:
                  # pandas < 2.2 uses M instead of ME.
                  rule = "M" if rule == "ME" else rule
                  grouped = panel.resample(rule)

              def compound(x: pd.Series) -> float:
                  x = x.dropna()
                  if x.empty:
                      return np.nan
                  return float(np.prod(1.0 + x) - 1.0)

              out = grouped.apply(compound)
              out = out.dropna(how="all")
              observed_dates = pd.Series(panel.index, index=panel.index).resample(rule).max()
              out.index = pd.DatetimeIndex(observed_dates.loc[out.index].to_numpy())
              out.index.name = panel.index.name
              return out
          '''.replace("          ", "")

          new_function = '''def compound_resample(panel: pd.DataFrame, frequency: str) -> pd.DataFrame:
              if frequency == "daily":
                  return panel.copy()

              period_rule = {"weekly": "W-FRI", "monthly": "M"}[frequency]
              periods = pd.DatetimeIndex(panel.index).to_period(period_rule)

              def compound(x: pd.Series) -> float:
                  x = x.dropna()
                  if x.empty:
                      return np.nan
                  return float(np.prod(1.0 + x) - 1.0)

              out = panel.groupby(periods, sort=True).agg(compound)
              out = out.dropna(how="all")
              observed_dates = pd.Series(panel.index, index=panel.index).groupby(periods, sort=True).max()
              out.index = pd.DatetimeIndex(observed_dates.loc[out.index].to_numpy())
              out.index.name = panel.index.name
              return out
          '''.replace("          ", "")

          replace_once(
              "examples/a_share_financial_rotation_tushare/a_share_financial_rotation_study.py",
              old_function,
              new_function,
          )

          old_polars = '''polars==1.43.0 \\
              --hash=sha256:bb2c67553e4968c18dfe268a88ff9a5790d5c2e0b7ea7efe97640b9a90438c88 \\
              --hash=sha256:c49078b14e2d6b8ff5cc5b78b6d9638603ea5dffafb889d9204818822f55b813
              # via -r requirements.txt
          polars-runtime-32==1.43.0 \\
              --hash=sha256:01e1471a5ee161a969c7a96991d8e5d20b97a0b7fe075df9c7a01f52a49c5ac2 \\
              --hash=sha256:3ecc8feaf04de5989a29245885921db612ef1ce9065e5cb6ec37495acfa55bba \\
              --hash=sha256:41a75fb3cb4cc574eb21801383578f75cfc374597c22322ef457ab7bac8a3301 \\
              --hash=sha256:4ffa99bb2c7ee0a9392ae50b350af0ed17acf0519d15c75fe223021798566174 \\
              --hash=sha256:5fb47a3a883402e62eab2fde5922f78c531d037aeece3640c15225f39228621e \\
              --hash=sha256:6707193d30a7135bce0424304f76d8145270527444097548e794ad8d26823b70 \\
              --hash=sha256:78ca2f97740b2a6beb36eb112749280b5e08750c60f53c08d2feffebdba9d35a \\
              --hash=sha256:9cd8b813afe67d59e87027dedcaf5c6a06fe602472fd74e1a49f4bafea47259c \\
              --hash=sha256:c285e598dd91e08560e519275b8b8108adbafb438d218a175ebe073dbc2027fb
              # via polars
          '''.replace("          ", "")

          new_polars = '''polars==1.44.1 \\
              --hash=sha256:1fa62fc1c88fba77a68b28291b5aabdd69e5f38b34e59721a064ae3169b59bb5 \\
              --hash=sha256:ef3c89e9ebbbe8eb343c06873f1945683f8b6f97a1bdf001c60551c6c5e3cda1
              # via -r requirements.txt
          polars-runtime-32==1.44.1 \\
              --hash=sha256:04e2c0f46e7a9906fffb1897f18f23b079b74f83c56b50060bace9e7b9b49b1a \\
              --hash=sha256:0580807dc3eed258f0db70bb65d905dd43f0135392119ec25308033ae24258fb \\
              --hash=sha256:0627f9aa82cb869725235e5188f698862fd9ada0c8c1cf65c3dc5a49a4a0ec26 \\
              --hash=sha256:0956f0cae632d8fad3a04b4315bf2bb69b56d10c83c79a75c2c4c5a13b9ce5cc \\
              --hash=sha256:159334184e6fbb074c9f4692221ea19970a5e2bed2a479f9d7bdb00b7f3eedb9 \\
              --hash=sha256:1dfccb2b52aa50468a7d28e3e61c8338a13fb5bffc8646e388a649f5bdc6b463 \\
              --hash=sha256:3ba28d638d0513e0b4afbcdab5c0059a85021e5f81d62b5f793e7e23badb2cf7 \\
              --hash=sha256:abd10a54ed1caff42228610fcba0f93251f9870bd7cffb0c78bc26f5e0718ce4 \\
              --hash=sha256:eea4283be8e60822d890dbda20588fe59b4172b508bd5ebf3471e531ca9f50d7
              # via polars
          '''.replace("          ", "")

          for lock in ("web/backend/requirements.lock", "web/backend/requirements-ml.lock"):
              replace_once(lock, old_polars, new_polars)
              text = Path(lock).read_text(encoding="utf-8")
              if "polars==1.43.0" in text or "polars-runtime-32==1.43.0" in text:
                  raise SystemExit(f"stale Polars pin remains in {lock}")

          top_level = Path("web/backend/requirements.txt").read_text(encoding="utf-8")
          if "polars==1.44.1" not in top_level:
              raise SystemExit("requirements.txt is not pinned to polars 1.44.1")
          PY
          git diff --check
          python -m compileall -q examples/a_share_financial_rotation_tushare web/backend/app
      - name: Commit generated maintenance changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/a_share_financial_rotation_tushare/a_share_financial_rotation_study.py web/backend/requirements.lock web/backend/requirements-ml.lock
          git diff --cached --exit-code && { echo "expected maintenance changes were not produced" >&2; exit 1; } || true
          git commit -m "fix: clear data stack deprecations"
          git push origin HEAD:ci/close-certification-validation-gaps
