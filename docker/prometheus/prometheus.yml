global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: lean-api-local
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/lean_api_token
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: lean-api-compose
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/lean_api_token
    static_configs:
      - targets: ["api:8000"]
