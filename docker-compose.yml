x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-platform-environment: &platform-environment
  LEAN_RELEASE_SHA: ${LEAN_RELEASE_SHA:-unknown}
  LEAN_RELEASE_ID: ${LEAN_RELEASE_ID:-local-unversioned}
  LEAN_DEPLOYMENT_MODE: docker
  LEAN_EXECUTION_BACKEND: docker
  LEAN_DEPLOYMENT_PROFILE: ${LEAN_DEPLOYMENT_PROFILE:-full}
  LEAN_STRICT_RUNTIME_V2: "1"
  LEAN_DATABASE_URL: postgresql+psycopg://lean_app:${LEAN_POSTGRES_APP_PASSWORD:?LEAN_POSTGRES_APP_PASSWORD must be set}@postgres:5432/lean_platform
  CELERY_BROKER_URL: amqp://lean_worker:${LEAN_RABBITMQ_PASSWORD:?LEAN_RABBITMQ_PASSWORD must be set}@rabbitmq:5672/lean
  CELERY_RESULT_BACKEND: db+postgresql+psycopg://lean_celery:${LEAN_POSTGRES_CELERY_PASSWORD:?LEAN_POSTGRES_CELERY_PASSWORD must be set}@postgres:5432/lean_celery
  LEAN_MLFLOW_DATABASE_URL: postgresql+psycopg://lean_mlflow:${LEAN_POSTGRES_MLFLOW_PASSWORD:?LEAN_POSTGRES_MLFLOW_PASSWORD must be set}@postgres:5432/lean_mlflow
  CLICKHOUSE_ENABLED: ${CLICKHOUSE_ENABLED:-0}
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_USERNAME: lean
  CLICKHOUSE_PASSWORD: ${LEAN_CLICKHOUSE_PASSWORD:-lean}
  CLICKHOUSE_DATABASE: lean_market
  LEAN_DATA_DIR: /workspace/data
  LEAN_PARQUET_DIR: /workspace/data/output/parquet
  LEAN_OBJECT_STORE_MODE: ${LEAN_OBJECT_STORE_MODE:-filesystem}
  LEAN_FILE_OBJECT_STORE_DIR: /workspace/data/object-store
  LEAN_TUSHARE_TYPED_SOURCE_WRITES: "0"
  LEAN_TUSHARE_CALLS_PER_MINUTE: ${LEAN_TUSHARE_CALLS_PER_MINUTE:-500}
  LEAN_TUSHARE_FETCH_CONCURRENCY: ${LEAN_TUSHARE_FETCH_CONCURRENCY:-16}
  LEAN_DATA_SYNC_BATCH_UNITS: ${LEAN_DATA_SYNC_BATCH_UNITS:-16}
  LEAN_DATA_SYNC_CHUNK_ROWS: ${LEAN_DATA_SYNC_CHUNK_ROWS:-100000}
  LEAN_DAILY_SYNC_BATCH_UNITS: ${LEAN_DAILY_SYNC_BATCH_UNITS:-16}
  LEAN_DAILY_SYNC_CHUNK_ROWS: ${LEAN_DAILY_SYNC_CHUNK_ROWS:-100000}
  LEAN_DAILY_INCREMENT_BATCH_DATES: ${LEAN_DAILY_INCREMENT_BATCH_DATES:-16}
  LEAN_TUSHARE_LINEAGE_ASYNC: ${LEAN_TUSHARE_LINEAGE_ASYNC:-1}
  LEAN_RAW_ARCHIVE_GZIP_LEVEL: ${LEAN_RAW_ARCHIVE_GZIP_LEVEL:-1}
  LEAN_PARQUET_PARTITION_ROWS: ${LEAN_PARQUET_PARTITION_ROWS:-100000}
  POLARS_MAX_THREADS: ${LEAN_PARQUET_MAX_THREADS:-4}
  TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
  LEAN_API_AUTH_REQUIRED: ${LEAN_API_AUTH_REQUIRED:-1}
  LEAN_API_TOKEN_FILE: /run/secrets/lean_api_token
  LEAN_RUNNER_TOKEN_FILE: /run/secrets/lean_runner_token
  LEAN_ALERT_WEBHOOK_URL: ${LEAN_ALERT_WEBHOOK_URL:-}
  LEAN_ALERT_WEBHOOK_BEARER_TOKEN: ${LEAN_ALERT_WEBHOOK_BEARER_TOKEN:-}
  LEAN_ALERT_ESCALATION_WEBHOOK_URL: ${LEAN_ALERT_ESCALATION_WEBHOOK_URL:-}
  LEAN_ALERT_ESCALATION_WEBHOOK_BEARER_TOKEN: ${LEAN_ALERT_ESCALATION_WEBHOOK_BEARER_TOKEN:-}
  LEAN_POSTGRES_BACKUP_DIR: /workspace/web/runtime/backups/postgres
  LEAN_POSTGRES_BACKUP_HOUR: ${LEAN_POSTGRES_BACKUP_HOUR:-3}
  LEAN_POSTGRES_BACKUP_MINUTE: ${LEAN_POSTGRES_BACKUP_MINUTE:-0}
  LEAN_POSTGRES_BACKUP_RETENTION_DAYS: ${LEAN_POSTGRES_BACKUP_RETENTION_DAYS:-7}
  LEAN_POSTGRES_BACKUP_MAX_FILES: ${LEAN_POSTGRES_BACKUP_MAX_FILES:-14}
  LEAN_PAPER_ORDER_PIPELINE_V2_ENABLED: ${LEAN_PAPER_ORDER_PIPELINE_V2_ENABLED:-1}
  LEAN_SCHEDULED_AUTOMATION_ENABLED: ${LEAN_SCHEDULED_AUTOMATION_ENABLED:-1}
  LEAN_DERIVED_MAINTENANCE_HOUR: ${LEAN_DERIVED_MAINTENANCE_HOUR:-19}
  LEAN_DERIVED_MAINTENANCE_MINUTE: ${LEAN_DERIVED_MAINTENANCE_MINUTE:-30}
  LEAN_PAPER_WALKFORWARD_HOUR: ${LEAN_PAPER_WALKFORWARD_HOUR:-18}
  LEAN_PAPER_WALKFORWARD_MINUTE: ${LEAN_PAPER_WALKFORWARD_MINUTE:-45}

x-backend-service: &backend-service
  profiles: ["app"]
  logging: *bounded-logging
  restart: unless-stopped
  build:
    context: .
    dockerfile: web/backend/Dockerfile
  environment:
    <<: *platform-environment
  volumes:
    - .:/workspace:ro
    - ./web/runtime:/workspace/web/runtime
    - ${LEAN_HOST_DATA_DIR:-${PWD}/data}:/workspace/data
    - ${LEAN_HOST_PARQUET_DIR:-${PWD}/data/output/parquet}:/workspace/data/output/parquet
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
    - /workspace/web/runtime/secrets:rw,noexec,nosuid,size=1m,mode=0700
  depends_on:
    migration:
      condition: service_completed_successfully
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: postgres:17.11
    logging: *bounded-logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LEAN_POSTGRES_ADMIN_PASSWORD:?LEAN_POSTGRES_ADMIN_PASSWORD must be set}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${LEAN_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    stop_grace_period: 2m
    cpus: "${LEAN_POSTGRES_CPUS:-4.0}"
    mem_limit: ${LEAN_POSTGRES_MEMORY:-6g}

  rabbitmq:
    image: rabbitmq:4.3.5-management
    logging: *bounded-logging
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: lean_worker
      RABBITMQ_DEFAULT_PASS: ${LEAN_RABBITMQ_PASSWORD:?LEAN_RABBITMQ_PASSWORD must be set}
      RABBITMQ_DEFAULT_VHOST: lean
    ports:
      - "127.0.0.1:${LEAN_RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${LEAN_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    cpus: "${LEAN_RABBITMQ_CPUS:-1.0}"
    mem_limit: ${LEAN_RABBITMQ_MEMORY:-1g}

  postgres-init:
    profiles: ["app"]
    logging: *bounded-logging
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    command: python /workspace/scripts/init_postgres_databases.py
    environment:
      LEAN_POSTGRES_ADMIN_URL: postgresql://postgres:${LEAN_POSTGRES_ADMIN_PASSWORD:?LEAN_POSTGRES_ADMIN_PASSWORD must be set}@postgres:5432/postgres
      LEAN_POSTGRES_APP_PASSWORD: ${LEAN_POSTGRES_APP_PASSWORD:?LEAN_POSTGRES_APP_PASSWORD must be set}
      LEAN_POSTGRES_CELERY_PASSWORD: ${LEAN_POSTGRES_CELERY_PASSWORD:?LEAN_POSTGRES_CELERY_PASSWORD must be set}
      LEAN_POSTGRES_MLFLOW_PASSWORD: ${LEAN_POSTGRES_MLFLOW_PASSWORD:?LEAN_POSTGRES_MLFLOW_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy

  migration:
    profiles: ["app"]
    logging: *bounded-logging
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    command: python /workspace/scripts/db_migrate.py apply --json
    environment:
      <<: *platform-environment
    depends_on:
      postgres-init:
        condition: service_completed_successfully

  mlflow-db-upgrade:
    profiles: ["app"]
    logging: *bounded-logging
    build:
      context: .
      dockerfile: web/backend/Dockerfile.ml
    command: >-
      mlflow db upgrade
      postgresql+psycopg://lean_mlflow:${LEAN_POSTGRES_MLFLOW_PASSWORD:?LEAN_POSTGRES_MLFLOW_PASSWORD must be set}@postgres:5432/lean_mlflow
    depends_on:
      postgres-init:
        condition: service_completed_successfully

  mlflow:
    profiles: ["app"]
    logging: *bounded-logging
    restart: unless-stopped
    build:
      context: .
      dockerfile: web/backend/Dockerfile.ml
    command: >-
      mlflow server --host 0.0.0.0 --port 5000 --workers 1
      --backend-store-uri postgresql+psycopg://lean_mlflow:${LEAN_POSTGRES_MLFLOW_PASSWORD:?LEAN_POSTGRES_MLFLOW_PASSWORD must be set}@postgres:5432/lean_mlflow
      --artifacts-destination /mlartifacts --serve-artifacts
    ports:
      - "127.0.0.1:${LEAN_MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-artifacts:/mlartifacts
    depends_on:
      mlflow-db-upgrade:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    <<: *backend-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *platform-environment
      LEAN_RELEASE_ROLE: api
      LEAN_BACKTEST_EXECUTION_DELEGATED: "1"
      LEAN_RUNNER_URL: http://lean-runner:8010
      MLFLOW_PUBLIC_URL: http://127.0.0.1:${LEAN_MLFLOW_PORT:-5000}
      PROMETHEUS_URL: http://127.0.0.1:${LEAN_PROMETHEUS_PORT:-9090}
      GRAFANA_URL: http://127.0.0.1:${LEAN_GRAFANA_PORT:-3000}
    ports:
      - "127.0.0.1:${LEAN_API_PORT:-8000}:8000"
    secrets: [lean_api_token, lean_runner_token]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    <<: *backend-service
    command: celery -A app.tasks.celery_app worker --loglevel=info --pool=prefork --concurrency=1 --prefetch-multiplier=1 --queues=default --hostname=default@%h
    environment:
      <<: *platform-environment
      LEAN_RELEASE_ROLE: default-worker
      LEAN_WORKER_MAX_TASKS_PER_CHILD: ${LEAN_WORKER_MAX_TASKS_PER_CHILD:-50}
      LEAN_WORKER_MAX_MEMORY_PER_CHILD_KB: ${LEAN_WORKER_MAX_MEMORY_PER_CHILD_KB:-1572864}

  data-worker:
    <<: *backend-service
    command: celery -A app.tasks.celery_app worker --loglevel=info --pool=prefork --concurrency=1 --prefetch-multiplier=1 --queues=data-bulk --hostname=data-bulk@%h
    environment:
      <<: *platform-environment
      LEAN_RELEASE_ROLE: data-worker
    mem_limit: ${LEAN_DATA_WORKER_MEMORY:-6g}

  data-lineage-worker:
    <<: *backend-service
    command: celery -A app.tasks.celery_app worker --loglevel=info --pool=prefork --concurrency=1 --prefetch-multiplier=1 --queues=data-lineage --hostname=data-lineage@%h
    environment:
      <<: *platform-environment
      LEAN_RELEASE_ROLE: data-lineage-worker

  data-demand-worker:
    <<: *backend-service
    command: celery -A app.tasks.celery_app worker --loglevel=info --pool=prefork --concurrency=${LEAN_DATA_DEMAND_WORKER_CONCURRENCY:-2} --prefetch-multiplier=1 --queues=data-demand --hostname=data-demand@%h
    environment:
      <<: *platform-environment
      LEAN_RELEASE_ROLE: data-demand-worker

  backtest-worker:
    <<: *backend-service
    command: celery -A app.tasks.celery_app worker --loglevel=info --pool=prefork --concurrency=${LEAN_BACKTEST_WORKER_CONCURRENCY:-1} --prefetch-multiplier=1 --queues=backtest --hostname=backtest@%h
    environment:
      <<: *platform-environment
      LEAN_RELEASE_ROLE: backtest-worker
      LEAN_RUNNER_URL: http://lean-runner:8010
    secrets: [lean_runner_token]
    depends_on:
      migration:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      lean-runner:
        condition: service_healthy

  ml-worker:
    <<: *backend-service
    build:
      context: .
      dockerfile: web/backend/Dockerfile.ml
    command: celery -A app.tasks.celery_app worker --loglevel=info --pool=prefork --concurrency=1 --prefetch-multiplier=1 --queues=ml --hostname=ml@%h
    environment:
      <<: *platform-environment
      LEAN_RELEASE_ROLE: ml-worker
      MLFLOW_TRACKING_URI: http://mlflow:5000
      LEAN_MLFLOW_EXPERIMENT: lean-ashare-cross-sectional
    depends_on:
      migration:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  beat:
    <<: *backend-service
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      <<: *platform-environment
      LEAN_RELEASE_ROLE: beat

  lean-runner:
    <<: *backend-service
    command: uvicorn app.runner_service:app --host 0.0.0.0 --port 8010
    environment:
      <<: *platform-environment
      LEAN_RELEASE_ROLE: lean-runner
      LEAN_HOST_PLATFORM_DIR: ${LEAN_HOST_PLATFORM_DIR:-${PWD}}
      LEAN_HOST_DATA_DIR: ${LEAN_HOST_DATA_DIR:-${PWD}/data}
      LEAN_HOST_PARQUET_DIR: ${LEAN_HOST_PARQUET_DIR:-${PWD}/data/output/parquet}
      LEAN_DOCKER_NETWORK: none
      LEAN_DOCKER_READ_ONLY: "1"
    volumes:
      - .:/workspace:ro
      - ${LEAN_HOST_DATA_DIR:-${PWD}/data}:/workspace/data:ro
      - /var/run/docker.sock:/var/run/docker.sock
    secrets: [lean_runner_token]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    profiles: ["clickhouse"]
    logging: *bounded-logging
    image: clickhouse/clickhouse-server:24.12-alpine@sha256:cd450891db46cc6ffe313ca2b0fb7dbfb897a6873ca74a724cbe050a2cf62621
    environment:
      CLICKHOUSE_DB: lean_market
      CLICKHOUSE_USER: lean
      CLICKHOUSE_PASSWORD: ${LEAN_CLICKHOUSE_PASSWORD:-lean}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes: [clickhouse-data:/var/lib/clickhouse]

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    ports: ["127.0.0.1:${LEAN_PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.4.0@sha256:d8ea37798ccc41061a62ab080f2676dda6bf7815558499f901bdb0f533a456fb
    ports: ["127.0.0.1:${LEAN_GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${LEAN_GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  postgres-integration:
    profiles: ["test"]
    image: postgres:17.11
    environment:
      POSTGRES_DB: lean_integration
      POSTGRES_USER: lean_integration
      POSTGRES_PASSWORD: integration-only
    tmpfs: [/var/lib/postgresql/data:size=1g,mode=0700]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lean_integration -d lean_integration"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres-integration-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    command: python -m pytest -q tests/test_postgres_integration_lane.py
    environment:
      RUN_POSTGRES_INTEGRATION: "1"
      LEAN_DATABASE_URL: postgresql+psycopg://lean_integration:integration-only@postgres-integration:5432/lean_integration
      LEAN_API_AUTH_REQUIRED: "0"
      LEAN_DATA_DIR: /tmp/lean-integration-data
      LEAN_PARQUET_DIR: /tmp/lean-integration-parquet
    depends_on:
      postgres-integration:
        condition: service_healthy
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /workspace/web/runtime:size=256m,mode=0700
    read_only: true

volumes:
  postgres-data:
  rabbitmq-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:
  mlflow-artifacts:

secrets:
  lean_api_token:
    file: ${LEAN_API_TOKEN_FILE:-./web/runtime/secrets/api_token}
  lean_runner_token:
    file: ${LEAN_RUNNER_TOKEN_FILE:-./web/runtime/secrets/runner_token}
