x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-release-environment: &release-environment
  LEAN_RELEASE_SHA: ${LEAN_RELEASE_SHA:-unknown}
  LEAN_RELEASE_ID: ${LEAN_RELEASE_ID:-local-unversioned}

services:
  redis:
    logging: *bounded-logging
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    ports:
      - "127.0.0.1:${LEAN_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    cpus: "${LEAN_REDIS_CPUS:-1.0}"
    mem_limit: ${LEAN_REDIS_MEMORY:-512m}

  mysql:
    logging: *bounded-logging
    image: mysql:8.4@sha256:d36d39a64cd12a5c1cc9e6aa2bfb5f8d4c81a2f6586e0a04a9ae13939db02209
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: lean-root
      MYSQL_DATABASE: lean_market
      MYSQL_USER: lean
      MYSQL_PASSWORD: lean
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=${LEAN_MYSQL_BUFFER_POOL_SIZE:-1G}
      - --innodb-redo-log-capacity=${LEAN_MYSQL_REDO_LOG_CAPACITY:-256M}
      - --binlog-expire-logs-seconds=${LEAN_MYSQL_BINLOG_EXPIRE_SECONDS:-604800}
      - --binlog-row-image=MINIMAL
      - --log-bin-trust-function-creators=1
      - --max-allowed-packet=256M
    ports:
      - "127.0.0.1:${LEAN_MYSQL_PORT:-3306}:3306"
    volumes:
      - ${LEAN_MYSQL_DATA_DIR:-mysql-data}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ulean", "-plean"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 2m
    cpus: "${LEAN_MYSQL_CPUS:-2.0}"
    mem_limit: ${LEAN_MYSQL_MEMORY:-3g}

  mysql-integration:
    profiles: ["test"]
    logging: *bounded-logging
    image: mysql:8.4@sha256:d36d39a64cd12a5c1cc9e6aa2bfb5f8d4c81a2f6586e0a04a9ae13939db02209
    environment:
      MYSQL_ROOT_PASSWORD: integration-root-only
      MYSQL_DATABASE: lean_integration
      MYSQL_USER: lean_integration
      MYSQL_PASSWORD: integration-only
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
    tmpfs:
      - /var/lib/mysql:size=1g,mode=0700
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ulean_integration", "-pintegration-only"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s

  mlflow-db-init:
    profiles: ["app"]
    logging: *bounded-logging
    image: mysql:8.4@sha256:d36d39a64cd12a5c1cc9e6aa2bfb5f8d4c81a2f6586e0a04a9ae13939db02209
    command:
      - sh
      - -c
      - mysql -hmysql -uroot -plean-root -e "set global log_bin_trust_function_creators=1; create database if not exists lean_mlflow character set utf8mb4 collate utf8mb4_0900_ai_ci; grant all privileges on lean_mlflow.* to 'lean'@'%'; flush privileges;"
    depends_on:
      mysql:
        condition: service_healthy

  mlflow:
    profiles: ["app"]
    logging: *bounded-logging
    build:
      context: .
      dockerfile: web/backend/Dockerfile.ml
    command: mlflow server --host 0.0.0.0 --port 5000 --workers 1 --backend-store-uri mysql+pymysql://lean:lean@mysql:3306/lean_mlflow --artifacts-destination /mlartifacts --serve-artifacts
    ports:
      - "127.0.0.1:${LEAN_MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-artifacts:/mlartifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      mlflow-db-init:
        condition: service_completed_successfully
    cpus: "${LEAN_MLFLOW_CPUS:-1.0}"
    mem_limit: ${LEAN_MLFLOW_MEMORY:-2g}

  clickhouse:
    logging: *bounded-logging
    image: clickhouse/clickhouse-server:24.12-alpine@sha256:cd450891db46cc6ffe313ca2b0fb7dbfb897a6873ca74a724cbe050a2cf62621
    environment:
      CLICKHOUSE_DB: lean_market
      CLICKHOUSE_USER: lean
      CLICKHOUSE_PASSWORD: lean
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${LEAN_CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${LEAN_CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    cpus: "${LEAN_CLICKHOUSE_CPUS:-2.0}"
    mem_limit: ${LEAN_CLICKHOUSE_MEMORY:-4g}

  prometheus:
    logging: *bounded-logging
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    ports:
      - "127.0.0.1:${LEAN_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - lean_api_token
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cpus: "${LEAN_PROMETHEUS_CPUS:-1.0}"
    mem_limit: ${LEAN_PROMETHEUS_MEMORY:-1g}

  grafana:
    logging: *bounded-logging
    image: grafana/grafana:11.4.0@sha256:d8ea37798ccc41061a62ab080f2676dda6bf7815558499f901bdb0f533a456fb
    ports:
      - "127.0.0.1:${LEAN_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource 4.20.0
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - clickhouse
    cpus: "${LEAN_GRAFANA_CPUS:-1.0}"
    mem_limit: ${LEAN_GRAFANA_MEMORY:-512m}

  api:
    logging: *bounded-logging
    profiles: ["app"]
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:${LEAN_API_PORT:-8000}:8000"
    environment:
      <<: *release-environment
      LEAN_RELEASE_ROLE: api
      REDIS_URL: redis://redis:6379/0
      LEAN_API_AUTH_REQUIRED: ${LEAN_API_AUTH_REQUIRED:-1}
      LEAN_API_TOKEN: ${LEAN_API_TOKEN:-}
      LEAN_API_TOKEN_FILE: /run/secrets/lean_api_token
      LEAN_BACKTEST_EXECUTION_DELEGATED: "1"
      LEAN_RUNNER_URL: http://lean-runner:8010
      LEAN_RUNNER_TOKEN_FILE: /run/secrets/lean_runner_token
      LEAN_DATABASE_URL: mysql+pymysql://lean:lean@mysql:3306/lean_market
      MLFLOW_PUBLIC_URL: http://127.0.0.1:${LEAN_MLFLOW_PORT:-5000}
      LEAN_MYSQL_ON_DEMAND_MAX_DATABASE_GB: ${LEAN_MYSQL_ON_DEMAND_MAX_DATABASE_GB:-50}
      LEAN_MYSQL_DATA_OBSERVER_DIR: /var/lib/mysql-observer
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USERNAME: lean
      CLICKHOUSE_PASSWORD: lean
      CLICKHOUSE_DATABASE: lean_market
      PROMETHEUS_URL: http://127.0.0.1:9090
      GRAFANA_URL: http://127.0.0.1:${LEAN_GRAFANA_PORT:-3000}
      LEAN_DATA_DIR: /workspace/Data
      LEAN_PARQUET_DIR: /workspace/parquet
      # Keep CPU-heavy Parquet compression from starving MySQL, the API and
      # Docker Desktop during a governed full rebuild.
      POLARS_MAX_THREADS: ${LEAN_PARQUET_MAX_THREADS:-4}
      LEAN_PARQUET_PARTITION_ROWS: ${LEAN_PARQUET_PARTITION_ROWS:-100000}
      LEAN_HOST_PLATFORM_DIR: ${LEAN_HOST_PLATFORM_DIR:-${PWD}}
      LEAN_HOST_DATA_DIR: ${LEAN_HOST_DATA_DIR:-${PWD}/../Data}
      LEAN_HOST_PARQUET_DIR: ${LEAN_HOST_PARQUET_DIR:-${PWD}/../Data/parquet}
      LEAN_ON_DEMAND_EXPORT_ROOTS: ${LEAN_ON_DEMAND_EXPORT_ROOTS:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LEAN_INSIGHTS_LLM_PROVIDER: ${LEAN_INSIGHTS_LLM_PROVIDER:-}
      LEAN_INSIGHTS_LLM_BASE_URL: ${LEAN_INSIGHTS_LLM_BASE_URL:-}
      LEAN_INSIGHTS_LLM_MODEL: ${LEAN_INSIGHTS_LLM_MODEL:-}
      LEAN_INSIGHTS_LLM_TIMEOUT_SECONDS: ${LEAN_INSIGHTS_LLM_TIMEOUT_SECONDS:-60}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      LEAN_ASHARE_TECH_REPORT_HOUR: ${LEAN_ASHARE_TECH_REPORT_HOUR:-17}
      LEAN_ASHARE_TECH_REPORT_MINUTE: ${LEAN_ASHARE_TECH_REPORT_MINUTE:-30}
      LEAN_ASHARE_TECH_AGENT_MODE: ${LEAN_ASHARE_TECH_AGENT_MODE:-hybrid_multi_agent}
      LEAN_ASHARE_TECH_EVALUATION_HOUR: ${LEAN_ASHARE_TECH_EVALUATION_HOUR:-18}
      LEAN_ASHARE_TECH_EVALUATION_MINUTE: ${LEAN_ASHARE_TECH_EVALUATION_MINUTE:-45}
      LEAN_PAPER_WALKFORWARD_HOUR: ${LEAN_PAPER_WALKFORWARD_HOUR:-18}
      LEAN_PAPER_WALKFORWARD_MINUTE: ${LEAN_PAPER_WALKFORWARD_MINUTE:-45}
      LEAN_DERIVED_MAINTENANCE_HOUR: ${LEAN_DERIVED_MAINTENANCE_HOUR:-19}
      LEAN_DERIVED_MAINTENANCE_MINUTE: ${LEAN_DERIVED_MAINTENANCE_MINUTE:-30}
      LEAN_PAPER_ORDER_PIPELINE_V2_ENABLED: ${LEAN_PAPER_ORDER_PIPELINE_V2_ENABLED:-1}
      LEAN_SCHEDULED_AUTOMATION_ENABLED: ${LEAN_SCHEDULED_AUTOMATION_ENABLED:-1}
      LEAN_MYSQL_BACKUP_HOUR: ${LEAN_MYSQL_BACKUP_HOUR:-3}
      LEAN_MYSQL_BACKUP_MINUTE: ${LEAN_MYSQL_BACKUP_MINUTE:-0}
      LEAN_ALERT_WEBHOOK_URL: ${LEAN_ALERT_WEBHOOK_URL:-}
      LEAN_ALERT_WEBHOOK_BEARER_TOKEN: ${LEAN_ALERT_WEBHOOK_BEARER_TOKEN:-}
      LEAN_ALERT_ESCALATION_WEBHOOK_URL: ${LEAN_ALERT_ESCALATION_WEBHOOK_URL:-}
      LEAN_ALERT_ESCALATION_WEBHOOK_BEARER_TOKEN: ${LEAN_ALERT_ESCALATION_WEBHOOK_BEARER_TOKEN:-}
      LEAN_ALERT_MIN_SEVERITY: ${LEAN_ALERT_MIN_SEVERITY:-error}
      LEAN_ALERT_ESCALATE_AFTER: ${LEAN_ALERT_ESCALATE_AFTER:-3}
      LEAN_ALERT_ESCALATION_AFTER: ${LEAN_ALERT_ESCALATION_AFTER:-1}
      LEAN_ALERT_COOLDOWN_SECONDS: ${LEAN_ALERT_COOLDOWN_SECONDS:-900}
      LEAN_ALERT_WEBHOOK_TIMEOUT_SECONDS: ${LEAN_ALERT_WEBHOOK_TIMEOUT_SECONDS:-5}
      LEAN_NOTIFICATION_MAX_ATTEMPTS: ${LEAN_NOTIFICATION_MAX_ATTEMPTS:-8}
      LEAN_NOTIFICATION_RETRY_BASE_SECONDS: ${LEAN_NOTIFICATION_RETRY_BASE_SECONDS:-60}
      LEAN_NOTIFICATION_RETRY_MAX_SECONDS: ${LEAN_NOTIFICATION_RETRY_MAX_SECONDS:-3600}
      LEAN_NOTIFICATION_RETRY_JITTER_PERCENT: ${LEAN_NOTIFICATION_RETRY_JITTER_PERCENT:-20}
      LEAN_RESOURCE_DISK_WARNING: ${LEAN_RESOURCE_DISK_WARNING:-75}
      LEAN_RESOURCE_DISK_CRITICAL: ${LEAN_RESOURCE_DISK_CRITICAL:-85}
      LEAN_RESOURCE_MEMORY_WARNING: ${LEAN_RESOURCE_MEMORY_WARNING:-80}
      LEAN_RESOURCE_MEMORY_CRITICAL: ${LEAN_RESOURCE_MEMORY_CRITICAL:-90}
      LEAN_RESOURCE_CPU_WARNING: ${LEAN_RESOURCE_CPU_WARNING:-85}
      LEAN_RESOURCE_CPU_CRITICAL: ${LEAN_RESOURCE_CPU_CRITICAL:-95}
      LEAN_RESOURCE_QUEUE_WARNING: ${LEAN_RESOURCE_QUEUE_WARNING:-20}
      LEAN_RESOURCE_QUEUE_CRITICAL: ${LEAN_RESOURCE_QUEUE_CRITICAL:-50}
      LEAN_RESOURCE_MONITOR_PATHS: ${LEAN_RESOURCE_MONITOR_PATHS:-}
      LEAN_FAULT_INJECTION_ENABLED: ${LEAN_FAULT_INJECTION_ENABLED:-0}
      LEAN_PAPER_CHECKPOINT_PAUSE_SECONDS: ${LEAN_PAPER_CHECKPOINT_PAUSE_SECONDS:-0}
      LEAN_PAPER_FAULT_PAUSE_PHASES: ${LEAN_PAPER_FAULT_PAUSE_PHASES:-intent_capture,constraint_validation,matching,ledger,snapshot_report,reconciliation}
      LEAN_PAPER_FAULT_PAUSE_TARGETS: ${LEAN_PAPER_FAULT_PAUSE_TARGETS:-}
      LEAN_PAPER_FINALIZE_STALE_SECONDS: ${LEAN_PAPER_FINALIZE_STALE_SECONDS:-120}
      LEAN_ASHARE_TECH_RETRY_MINUTES: ${LEAN_ASHARE_TECH_RETRY_MINUTES:-30}
      LEAN_ASHARE_TECH_CLOSE_TOLERANCE_PCT: ${LEAN_ASHARE_TECH_CLOSE_TOLERANCE_PCT:-0.15}
    volumes:
      - .:/workspace:ro
      - ./web/runtime:/workspace/web/runtime
      - ${LEAN_DATA_DIR:-../Data}:/workspace/Data
      - ${LEAN_HOST_PARQUET_DIR:-../Data/parquet}:/workspace/parquet
      - ${LEAN_MYSQL_DATA_DIR:-mysql-data}:/var/lib/mysql-observer:ro
    secrets:
      - lean_api_token
      - lean_runner_token
    tmpfs:
      - /workspace/web/runtime/secrets:rw,noexec,nosuid,size=1m,mode=0700
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_started
      worker:
        condition: service_started
      data-worker:
        condition: service_started
      data-demand-worker:
        condition: service_started
      backtest-worker:
        condition: service_started
      ml-worker:
        condition: service_started
      lean-runner:
        condition: service_healthy
    cpus: "${LEAN_API_CPUS:-2.0}"
    mem_limit: ${LEAN_API_MEMORY:-2g}

  worker:
    logging: *bounded-logging
    profiles: ["app"]
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info --pool=prefork --concurrency=1 --prefetch-multiplier=1 --queues=default --hostname=default@%h
    environment:
      <<: *release-environment
      LEAN_RELEASE_ROLE: default-worker
      REDIS_URL: redis://redis:6379/0
      LEAN_DATABASE_URL: mysql+pymysql://lean:lean@mysql:3306/lean_market
      LEAN_LOADER_DATABASE_URL: mysql+pymysql://lean_loader:${LEAN_MYSQL_LOADER_PASSWORD:-loader-not-configured}@mysql:3306/lean_market
      LEAN_MYSQL_BULK_DISABLE_BINLOG: "1"
      LEAN_MYSQL_ADDITIONAL_BACKUP_DATABASES: lean_mlflow
      LEAN_TUSHARE_CALLS_PER_MINUTE: ${LEAN_TUSHARE_CALLS_PER_MINUTE:-500}
      LEAN_TUSHARE_FETCH_CONCURRENCY: ${LEAN_TUSHARE_FETCH_CONCURRENCY:-16}
      LEAN_DAILY_BASIC_FETCH_CONCURRENCY: ${LEAN_DAILY_BASIC_FETCH_CONCURRENCY:-32}
      LEAN_DIVIDEND_FETCH_CONCURRENCY: ${LEAN_DIVIDEND_FETCH_CONCURRENCY:-32}
      LEAN_STK_LIMIT_FETCH_CONCURRENCY: ${LEAN_STK_LIMIT_FETCH_CONCURRENCY:-16}
      LEAN_SUSPEND_FETCH_CONCURRENCY: ${LEAN_SUSPEND_FETCH_CONCURRENCY:-16}
      LEAN_DATA_SYNC_BATCH_UNITS: ${LEAN_DATA_SYNC_BATCH_UNITS:-32}
      LEAN_DATA_SYNC_CHUNK_ROWS: ${LEAN_DATA_SYNC_CHUNK_ROWS:-250000}
      LEAN_DAILY_SYNC_BATCH_UNITS: ${LEAN_DAILY_SYNC_BATCH_UNITS:-64}
      LEAN_DAILY_SYNC_CHUNK_ROWS: ${LEAN_DAILY_SYNC_CHUNK_ROWS:-500000}
      LEAN_DAILY_INCREMENT_BATCH_DATES: ${LEAN_DAILY_INCREMENT_BATCH_DATES:-16}
      LEAN_RAW_ARCHIVE_GZIP_LEVEL: ${LEAN_RAW_ARCHIVE_GZIP_LEVEL:-1}
      LEAN_ALERT_WEBHOOK_URL: ${LEAN_ALERT_WEBHOOK_URL:-}
      LEAN_ALERT_WEBHOOK_BEARER_TOKEN: ${LEAN_ALERT_WEBHOOK_BEARER_TOKEN:-}
      LEAN_ALERT_ESCALATION_WEBHOOK_URL: ${LEAN_ALERT_ESCALATION_WEBHOOK_URL:-}
      LEAN_ALERT_ESCALATION_WEBHOOK_BEARER_TOKEN: ${LEAN_ALERT_ESCALATION_WEBHOOK_BEARER_TOKEN:-}
      LEAN_ALERT_MIN_SEVERITY: ${LEAN_ALERT_MIN_SEVERITY:-error}
      LEAN_ALERT_ESCALATE_AFTER: ${LEAN_ALERT_ESCALATE_AFTER:-3}
      LEAN_ALERT_ESCALATION_AFTER: ${LEAN_ALERT_ESCALATION_AFTER:-1}
      LEAN_ALERT_COOLDOWN_SECONDS: ${LEAN_ALERT_COOLDOWN_SECONDS:-900}
      LEAN_ALERT_WEBHOOK_TIMEOUT_SECONDS: ${LEAN_ALERT_WEBHOOK_TIMEOUT_SECONDS:-5}
      LEAN_NOTIFICATION_MAX_ATTEMPTS: ${LEAN_NOTIFICATION_MAX_ATTEMPTS:-8}
      LEAN_NOTIFICATION_RETRY_BASE_SECONDS: ${LEAN_NOTIFICATION_RETRY_BASE_SECONDS:-60}
      LEAN_NOTIFICATION_RETRY_MAX_SECONDS: ${LEAN_NOTIFICATION_RETRY_MAX_SECONDS:-3600}
      LEAN_NOTIFICATION_RETRY_JITTER_PERCENT: ${LEAN_NOTIFICATION_RETRY_JITTER_PERCENT:-20}
      LEAN_WORKER_MAX_TASKS_PER_CHILD: ${LEAN_WORKER_MAX_TASKS_PER_CHILD:-50}
      LEAN_WORKER_MAX_MEMORY_PER_CHILD_KB: ${LEAN_WORKER_MAX_MEMORY_PER_CHILD_KB:-1572864}
      LEAN_RESOURCE_DISK_WARNING: ${LEAN_RESOURCE_DISK_WARNING:-75}
      LEAN_RESOURCE_DISK_CRITICAL: ${LEAN_RESOURCE_DISK_CRITICAL:-85}
      LEAN_RESOURCE_MEMORY_WARNING: ${LEAN_RESOURCE_MEMORY_WARNING:-80}
      LEAN_RESOURCE_MEMORY_CRITICAL: ${LEAN_RESOURCE_MEMORY_CRITICAL:-90}
      LEAN_RESOURCE_CPU_WARNING: ${LEAN_RESOURCE_CPU_WARNING:-85}
      LEAN_RESOURCE_CPU_CRITICAL: ${LEAN_RESOURCE_CPU_CRITICAL:-95}
      LEAN_RESOURCE_QUEUE_WARNING: ${LEAN_RESOURCE_QUEUE_WARNING:-20}
      LEAN_RESOURCE_QUEUE_CRITICAL: ${LEAN_RESOURCE_QUEUE_CRITICAL:-50}
      LEAN_RESOURCE_MONITOR_PATHS: ${LEAN_RESOURCE_MONITOR_PATHS:-}
      LEAN_FAULT_INJECTION_ENABLED: ${LEAN_FAULT_INJECTION_ENABLED:-0}
      LEAN_PAPER_CHECKPOINT_PAUSE_SECONDS: ${LEAN_PAPER_CHECKPOINT_PAUSE_SECONDS:-0}
      LEAN_PAPER_FAULT_PAUSE_PHASES: ${LEAN_PAPER_FAULT_PAUSE_PHASES:-intent_capture,constraint_validation,matching,ledger,snapshot_report,reconciliation}
      LEAN_PAPER_FAULT_PAUSE_TARGETS: ${LEAN_PAPER_FAULT_PAUSE_TARGETS:-}
      LEAN_PAPER_FINALIZE_STALE_SECONDS: ${LEAN_PAPER_FINALIZE_STALE_SECONDS:-120}
      LEAN_MYSQL_ON_DEMAND_MAX_DATABASE_GB: ${LEAN_MYSQL_ON_DEMAND_MAX_DATABASE_GB:-50}
      LEAN_MYSQL_DATA_OBSERVER_DIR: /var/lib/mysql-observer
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USERNAME: lean
      CLICKHOUSE_PASSWORD: lean
      CLICKHOUSE_DATABASE: lean_market
      LEAN_DATA_DIR: /workspace/Data
      LEAN_PARQUET_DIR: /workspace/parquet
      POLARS_MAX_THREADS: ${LEAN_PARQUET_MAX_THREADS:-4}
      LEAN_PARQUET_PARTITION_ROWS: ${LEAN_PARQUET_PARTITION_ROWS:-100000}
      LEAN_HOST_PLATFORM_DIR: ${LEAN_HOST_PLATFORM_DIR:-${PWD}}
      LEAN_HOST_DATA_DIR: ${LEAN_HOST_DATA_DIR:-${PWD}/../Data}
      LEAN_HOST_PARQUET_DIR: ${LEAN_HOST_PARQUET_DIR:-${PWD}/../Data/parquet}
      LEAN_ON_DEMAND_EXPORT_ROOTS: ${LEAN_ON_DEMAND_EXPORT_ROOTS:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LEAN_INSIGHTS_LLM_PROVIDER: ${LEAN_INSIGHTS_LLM_PROVIDER:-}
      LEAN_INSIGHTS_LLM_BASE_URL: ${LEAN_INSIGHTS_LLM_BASE_URL:-}
      LEAN_INSIGHTS_LLM_MODEL: ${LEAN_INSIGHTS_LLM_MODEL:-}
      LEAN_INSIGHTS_LLM_TIMEOUT_SECONDS: ${LEAN_INSIGHTS_LLM_TIMEOUT_SECONDS:-60}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      LEAN_ASHARE_TECH_REPORT_HOUR: ${LEAN_ASHARE_TECH_REPORT_HOUR:-17}
      LEAN_ASHARE_TECH_REPORT_MINUTE: ${LEAN_ASHARE_TECH_REPORT_MINUTE:-30}
      LEAN_ASHARE_TECH_AGENT_MODE: ${LEAN_ASHARE_TECH_AGENT_MODE:-hybrid_multi_agent}
      LEAN_ASHARE_TECH_EVALUATION_HOUR: ${LEAN_ASHARE_TECH_EVALUATION_HOUR:-18}
      LEAN_ASHARE_TECH_EVALUATION_MINUTE: ${LEAN_ASHARE_TECH_EVALUATION_MINUTE:-45}
      LEAN_PAPER_WALKFORWARD_HOUR: ${LEAN_PAPER_WALKFORWARD_HOUR:-18}
      LEAN_PAPER_WALKFORWARD_MINUTE: ${LEAN_PAPER_WALKFORWARD_MINUTE:-45}
      LEAN_DERIVED_MAINTENANCE_HOUR: ${LEAN_DERIVED_MAINTENANCE_HOUR:-19}
      LEAN_DERIVED_MAINTENANCE_MINUTE: ${LEAN_DERIVED_MAINTENANCE_MINUTE:-30}
      LEAN_PAPER_ORDER_PIPELINE_V2_ENABLED: ${LEAN_PAPER_ORDER_PIPELINE_V2_ENABLED:-1}
      LEAN_SCHEDULED_AUTOMATION_ENABLED: ${LEAN_SCHEDULED_AUTOMATION_ENABLED:-1}
      LEAN_MYSQL_BACKUP_HOUR: ${LEAN_MYSQL_BACKUP_HOUR:-3}
      LEAN_MYSQL_BACKUP_MINUTE: ${LEAN_MYSQL_BACKUP_MINUTE:-0}
      LEAN_ASHARE_TECH_RETRY_MINUTES: ${LEAN_ASHARE_TECH_RETRY_MINUTES:-30}
      LEAN_ASHARE_TECH_CLOSE_TOLERANCE_PCT: ${LEAN_ASHARE_TECH_CLOSE_TOLERANCE_PCT:-0.15}
    volumes:
      - .:/workspace:ro
      - ./web/runtime:/workspace/web/runtime
      - ${LEAN_DATA_DIR:-../Data}:/workspace/Data
      - ${LEAN_HOST_PARQUET_DIR:-../Data/parquet}:/workspace/parquet
      - ${LEAN_MYSQL_DATA_DIR:-mysql-data}:/var/lib/mysql-observer:ro
    tmpfs:
      - /workspace/web/runtime/secrets:rw,noexec,nosuid,size=1m,mode=0700
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_started
    cpus: "${LEAN_DEFAULT_WORKER_CPUS:-2.0}"
    mem_limit: ${LEAN_DEFAULT_WORKER_MEMORY:-3g}

  data-worker:
    extends:
      service: worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --pool=prefork --concurrency=1 --prefetch-multiplier=1 --queues=data-bulk,data --hostname=data-bulk@%h
    environment:
      LEAN_RELEASE_ROLE: data-worker
      LEAN_REQUIRE_LOADER_DATABASE: "1"
      LEAN_WORKER_MAX_MEMORY_PER_CHILD_KB: ${LEAN_DATA_WORKER_MAX_MEMORY_PER_CHILD_KB:-5242880}
    cpus: "${LEAN_DATA_WORKER_CPUS:-2.0}"
    mem_limit: ${LEAN_DATA_WORKER_MEMORY:-6g}

  data-demand-worker:
    extends:
      service: worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --pool=prefork --concurrency=${LEAN_DATA_DEMAND_WORKER_CONCURRENCY:-2} --queues=data-demand --hostname=data-demand@%h
    environment:
      LEAN_RELEASE_ROLE: data-demand-worker
    cpus: "${LEAN_DATA_DEMAND_WORKER_CPUS:-2.0}"
    mem_limit: ${LEAN_DATA_DEMAND_WORKER_MEMORY:-4g}

  backtest-worker:
    extends:
      service: worker
    # Python.NET initialization in the pinned LEAN image is not reliable when
    # two sibling containers import the same read-only strategy snapshot at
    # once on Docker Desktop. Keep the safe default serial; operators may raise
    # it only after validating their runner/filesystem combination.
    command: celery -A app.tasks.celery_app worker --loglevel=info --pool=prefork --concurrency=${LEAN_BACKTEST_WORKER_CONCURRENCY:-1} --queues=backtest --hostname=backtest@%h
    environment:
      LEAN_RELEASE_ROLE: backtest-worker
      LEAN_RUNNER_URL: http://lean-runner:8010
      LEAN_RUNNER_TOKEN_FILE: /run/secrets/lean_runner_token
    volumes:
      - .:/workspace:ro
      - ./web/runtime:/workspace/web/runtime
      - ${LEAN_DATA_DIR:-../Data}:/workspace/Data
      - ${LEAN_HOST_PARQUET_DIR:-../Data/parquet}:/workspace/parquet
      - ${LEAN_MYSQL_DATA_DIR:-mysql-data}:/var/lib/mysql-observer:ro
    secrets:
      - lean_runner_token
    depends_on:
      lean-runner:
        condition: service_healthy
    cpus: "${LEAN_BACKTEST_WORKER_CPUS:-2.0}"
    mem_limit: ${LEAN_BACKTEST_WORKER_MEMORY:-4g}

  ml-worker:
    extends:
      service: worker
    build:
      context: .
      dockerfile: web/backend/Dockerfile.ml
    command: celery -A app.tasks.celery_app worker --loglevel=info --pool=prefork --concurrency=1 --prefetch-multiplier=1 --queues=ml --hostname=ml@%h
    environment:
      LEAN_RELEASE_ROLE: ml-worker
      MLFLOW_TRACKING_URI: http://mlflow:5000
      LEAN_MLFLOW_EXPERIMENT: lean-ashare-cross-sectional
      LEAN_ML_THREADS: ${LEAN_ML_THREADS:-4}
    cpus: "${LEAN_ML_WORKER_CPUS:-4.0}"
    mem_limit: ${LEAN_ML_WORKER_MEMORY:-8g}
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  lean-runner:
    logging: *bounded-logging
    profiles: ["app"]
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    command: uvicorn app.runner_service:app --host 0.0.0.0 --port 8010
    environment:
      <<: *release-environment
      LEAN_RELEASE_ROLE: lean-runner
      LEAN_DATABASE_URL: mysql+pymysql://lean:lean@mysql:3306/lean_market
      LEAN_RUNNER_TOKEN_FILE: /run/secrets/lean_runner_token
      LEAN_HOST_PLATFORM_DIR: ${LEAN_HOST_PLATFORM_DIR:-${PWD}}
      LEAN_HOST_DATA_DIR: ${LEAN_HOST_DATA_DIR:-${PWD}/../Data}
      LEAN_HOST_PARQUET_DIR: ${LEAN_HOST_PARQUET_DIR:-${PWD}/../Data/parquet}
      LEAN_DOCKER_NETWORK: none
      LEAN_DOCKER_CPUS: ${LEAN_DOCKER_CPUS:-2}
      LEAN_DOCKER_MEMORY: ${LEAN_DOCKER_MEMORY:-4g}
      LEAN_DOCKER_PIDS_LIMIT: ${LEAN_DOCKER_PIDS_LIMIT:-512}
      LEAN_DOCKER_READ_ONLY: "1"
    volumes:
      - .:/workspace:ro
      - ${LEAN_DATA_DIR:-../Data}:/workspace/Data:ro
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - lean_runner_token
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /workspace/web/runtime/secrets:rw,noexec,nosuid,size=1m,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: "1.0"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      mysql:
        condition: service_healthy

  beat:
    logging: *bounded-logging
    profiles: ["app"]
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      <<: *release-environment
      LEAN_RELEASE_ROLE: beat
      REDIS_URL: redis://redis:6379/0
      LEAN_DATABASE_URL: mysql+pymysql://lean:lean@mysql:3306/lean_market
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      LEAN_ASHARE_TECH_REPORT_HOUR: ${LEAN_ASHARE_TECH_REPORT_HOUR:-17}
      LEAN_ASHARE_TECH_REPORT_MINUTE: ${LEAN_ASHARE_TECH_REPORT_MINUTE:-30}
      LEAN_ASHARE_TECH_AGENT_MODE: ${LEAN_ASHARE_TECH_AGENT_MODE:-hybrid_multi_agent}
      LEAN_ASHARE_TECH_EVALUATION_HOUR: ${LEAN_ASHARE_TECH_EVALUATION_HOUR:-18}
      LEAN_ASHARE_TECH_EVALUATION_MINUTE: ${LEAN_ASHARE_TECH_EVALUATION_MINUTE:-45}
      LEAN_PAPER_WALKFORWARD_HOUR: ${LEAN_PAPER_WALKFORWARD_HOUR:-18}
      LEAN_PAPER_WALKFORWARD_MINUTE: ${LEAN_PAPER_WALKFORWARD_MINUTE:-45}
      LEAN_DERIVED_MAINTENANCE_HOUR: ${LEAN_DERIVED_MAINTENANCE_HOUR:-19}
      LEAN_DERIVED_MAINTENANCE_MINUTE: ${LEAN_DERIVED_MAINTENANCE_MINUTE:-30}
      LEAN_PAPER_ORDER_PIPELINE_V2_ENABLED: ${LEAN_PAPER_ORDER_PIPELINE_V2_ENABLED:-1}
      LEAN_SCHEDULED_AUTOMATION_ENABLED: ${LEAN_SCHEDULED_AUTOMATION_ENABLED:-1}
      LEAN_MYSQL_BACKUP_HOUR: ${LEAN_MYSQL_BACKUP_HOUR:-3}
      LEAN_MYSQL_BACKUP_MINUTE: ${LEAN_MYSQL_BACKUP_MINUTE:-0}
      LEAN_ASHARE_TECH_RETRY_MINUTES: ${LEAN_ASHARE_TECH_RETRY_MINUTES:-30}
      LEAN_ASHARE_TECH_CLOSE_TOLERANCE_PCT: ${LEAN_ASHARE_TECH_CLOSE_TOLERANCE_PCT:-0.15}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LEAN_INSIGHTS_LLM_PROVIDER: ${LEAN_INSIGHTS_LLM_PROVIDER:-}
      LEAN_INSIGHTS_LLM_BASE_URL: ${LEAN_INSIGHTS_LLM_BASE_URL:-}
      LEAN_INSIGHTS_LLM_MODEL: ${LEAN_INSIGHTS_LLM_MODEL:-}
      LEAN_INSIGHTS_LLM_TIMEOUT_SECONDS: ${LEAN_INSIGHTS_LLM_TIMEOUT_SECONDS:-60}
    volumes:
      - .:/workspace:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /workspace/web/runtime/secrets:rw,noexec,nosuid,size=1m,mode=0700
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    cpus: "${LEAN_BEAT_CPUS:-0.5}"
    mem_limit: ${LEAN_BEAT_MEMORY:-512m}

  mysql-integration-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    command: python -m pytest -q -m integration_mysql
    environment:
      RUN_MYSQL_INTEGRATION: "1"
      LEAN_DATABASE_URL: mysql+pymysql://lean_integration:integration-only@mysql-integration:3306/lean_integration
      LEAN_API_AUTH_REQUIRED: "0"
      LEAN_DATA_DIR: /tmp/lean-integration-data
      LEAN_PARQUET_DIR: /tmp/lean-integration-parquet
    depends_on:
      mysql-integration:
        condition: service_healthy
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /workspace/web/runtime:size=256m,mode=0700
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0

volumes:
  redis-data:
  mysql-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:
  mlflow-artifacts:

secrets:
  lean_api_token:
    file: ${LEAN_API_TOKEN_SOURCE_FILE:-./web/runtime/secrets/api_token}
  lean_runner_token:
    file: ${LEAN_RUNNER_TOKEN_SOURCE_FILE:-./web/runtime/secrets/runner_token}
