services:
  redis:
    image: redis:7-alpine
    ports:
      - "${LEAN_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: lean-root
      MYSQL_DATABASE: lean_market
      MYSQL_USER: lean
      MYSQL_PASSWORD: lean
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=1G
      - --max-allowed-packet=256M
    ports:
      - "${LEAN_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ulean", "-plean"]
      interval: 10s
      timeout: 5s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    environment:
      CLICKHOUSE_DB: lean_market
      CLICKHOUSE_USER: lean
      CLICKHOUSE_PASSWORD: lean
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${LEAN_CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${LEAN_CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "${LEAN_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "${LEAN_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - clickhouse

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${LEAN_API_PORT:-8000}:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      LEAN_DATABASE_URL: mysql+pymysql://lean:lean@mysql:3306/lean_market
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USERNAME: lean
      CLICKHOUSE_PASSWORD: lean
      CLICKHOUSE_DATABASE: lean_market
      PROMETHEUS_URL: http://127.0.0.1:9090
      GRAFANA_URL: http://127.0.0.1:3000
      LEAN_DATA_DIR: /workspace/Data
      LEAN_PARQUET_DIR: /workspace/parquet
      LEAN_HOST_PLATFORM_DIR: ${LEAN_HOST_PLATFORM_DIR:-${PWD}}
      LEAN_HOST_DATA_DIR: ${LEAN_HOST_DATA_DIR:-${PWD}/../Data}
      LEAN_HOST_PARQUET_DIR: ${LEAN_HOST_PARQUET_DIR:-${PWD}/../Data/parquet}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LEAN_INSIGHTS_LLM_PROVIDER: ${LEAN_INSIGHTS_LLM_PROVIDER:-}
      LEAN_INSIGHTS_LLM_BASE_URL: ${LEAN_INSIGHTS_LLM_BASE_URL:-}
      LEAN_INSIGHTS_LLM_MODEL: ${LEAN_INSIGHTS_LLM_MODEL:-}
      LEAN_INSIGHTS_LLM_TIMEOUT_SECONDS: ${LEAN_INSIGHTS_LLM_TIMEOUT_SECONDS:-60}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      LEAN_ASHARE_TECH_REPORT_HOUR: ${LEAN_ASHARE_TECH_REPORT_HOUR:-17}
      LEAN_ASHARE_TECH_REPORT_MINUTE: ${LEAN_ASHARE_TECH_REPORT_MINUTE:-30}
      LEAN_ASHARE_TECH_RETRY_MINUTES: ${LEAN_ASHARE_TECH_RETRY_MINUTES:-30}
      LEAN_ASHARE_TECH_CLOSE_TOLERANCE_PCT: ${LEAN_ASHARE_TECH_CLOSE_TOLERANCE_PCT:-0.15}
    volumes:
      - .:/workspace
      - ${LEAN_DATA_DIR:-../Data}:/workspace/Data
      - ${LEAN_HOST_PARQUET_DIR:-../Data/parquet}:/workspace/parquet
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_started

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info --pool=solo
    environment:
      REDIS_URL: redis://redis:6379/0
      LEAN_DATABASE_URL: mysql+pymysql://lean:lean@mysql:3306/lean_market
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USERNAME: lean
      CLICKHOUSE_PASSWORD: lean
      CLICKHOUSE_DATABASE: lean_market
      LEAN_DATA_DIR: /workspace/Data
      LEAN_PARQUET_DIR: /workspace/parquet
      LEAN_HOST_PLATFORM_DIR: ${LEAN_HOST_PLATFORM_DIR:-${PWD}}
      LEAN_HOST_DATA_DIR: ${LEAN_HOST_DATA_DIR:-${PWD}/../Data}
      LEAN_HOST_PARQUET_DIR: ${LEAN_HOST_PARQUET_DIR:-${PWD}/../Data/parquet}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LEAN_INSIGHTS_LLM_PROVIDER: ${LEAN_INSIGHTS_LLM_PROVIDER:-}
      LEAN_INSIGHTS_LLM_BASE_URL: ${LEAN_INSIGHTS_LLM_BASE_URL:-}
      LEAN_INSIGHTS_LLM_MODEL: ${LEAN_INSIGHTS_LLM_MODEL:-}
      LEAN_INSIGHTS_LLM_TIMEOUT_SECONDS: ${LEAN_INSIGHTS_LLM_TIMEOUT_SECONDS:-60}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      LEAN_ASHARE_TECH_REPORT_HOUR: ${LEAN_ASHARE_TECH_REPORT_HOUR:-17}
      LEAN_ASHARE_TECH_REPORT_MINUTE: ${LEAN_ASHARE_TECH_REPORT_MINUTE:-30}
      LEAN_ASHARE_TECH_RETRY_MINUTES: ${LEAN_ASHARE_TECH_RETRY_MINUTES:-30}
      LEAN_ASHARE_TECH_CLOSE_TOLERANCE_PCT: ${LEAN_ASHARE_TECH_CLOSE_TOLERANCE_PCT:-0.15}
    volumes:
      - .:/workspace
      - ${LEAN_DATA_DIR:-../Data}:/workspace/Data
      - ${LEAN_HOST_PARQUET_DIR:-../Data/parquet}:/workspace/parquet
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_started

  beat:
    profiles: ["app"]
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      REDIS_URL: redis://redis:6379/0
      LEAN_DATABASE_URL: mysql+pymysql://lean:lean@mysql:3306/lean_market
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      LEAN_ASHARE_TECH_REPORT_HOUR: ${LEAN_ASHARE_TECH_REPORT_HOUR:-17}
      LEAN_ASHARE_TECH_REPORT_MINUTE: ${LEAN_ASHARE_TECH_REPORT_MINUTE:-30}
      LEAN_ASHARE_TECH_RETRY_MINUTES: ${LEAN_ASHARE_TECH_RETRY_MINUTES:-30}
      LEAN_ASHARE_TECH_CLOSE_TOLERANCE_PCT: ${LEAN_ASHARE_TECH_CLOSE_TOLERANCE_PCT:-0.15}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LEAN_INSIGHTS_LLM_PROVIDER: ${LEAN_INSIGHTS_LLM_PROVIDER:-}
      LEAN_INSIGHTS_LLM_BASE_URL: ${LEAN_INSIGHTS_LLM_BASE_URL:-}
      LEAN_INSIGHTS_LLM_MODEL: ${LEAN_INSIGHTS_LLM_MODEL:-}
      LEAN_INSIGHTS_LLM_TIMEOUT_SECONDS: ${LEAN_INSIGHTS_LLM_TIMEOUT_SECONDS:-60}
    volumes:
      - .:/workspace
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy

volumes:
  redis-data:
  mysql-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:
