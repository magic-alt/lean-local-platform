<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">LEAN Local Platform social preview</title>
  <desc id="desc">Brand artwork for LEAN Local Platform showing governed data, research artifact, LEAN validation, and paper execution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080e1a"/>
      <stop offset="1" stop-color="#0d1828"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1110" cy="155" r="170" fill="#1665ff" opacity="0.06" filter="url(#soft)"/>

  <g opacity="0.35" stroke="#243a5d" stroke-width="1">
    <path d="M720 100H1250M720 170H1250M720 240H1250M720 310H1250M720 380H1250M720 450H1250M720 520H1250M720 590H1250"/>
    <path d="M760 80V590M840 80V590M920 80V590M1000 80V590M1080 80V590M1160 80V590M1240 80V590"/>
  </g>

