  <text x="72" y="208" fill="#f7faff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="58" font-weight="800">Reproducible quant research,</text>
  <text x="72" y="270" fill="#f7faff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="58" font-weight="800">LEAN validation &amp; paper execution</text>

  <text x="74" y="350" fill="#a5b8d5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="26">A local-first control plane around QuantConnect LEAN for governed A-share data,</text>
  <text x="74" y="384" fill="#a5b8d5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="26">artifact-based research handoff, backtesting, optimization and audit-ready evidence.</text>

