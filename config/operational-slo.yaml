    window: 30d
  restoreDrillSuccess:
    target: 100%
    cadenceDays: 90
  reconciliationSuccess:
    target: 100%
  storedObjectIntegrity:
    target: 100%

dr:
  # Current local implementation is one daily logical backup.  The former
  # 15-minute encrypted/off-site claim remains a target, not an achieved SLO.
  rpoMinutes: 1440
  rtoMinutes: 240
  fullBackupCadenceHours: 24
  incrementalOrWalCadenceMinutes: null
  retentionDays: 7
  restoreDrillCadenceDays: 90
  encryptionRequired: false
  independentStorageRequired: false
  certificationStatus: NOT_YET_PROVEN_AT_PRODUCTION_SCALE

resourceBudgets:
  postgresql:
    memory: 4g
    sharedBuffers: 1g
  rabbitmq:
    memory: 1g
  api:
    memory: 1g
    cpus: 2
  defaultWorker:
    memory: 2g
    cpus: 2
  leanPerRun:
    memory: 4g
    cpus: 2
    pids: 512
  maxConcurrentLeanJobs: 2
